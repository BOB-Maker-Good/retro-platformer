<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Retro Worlds — 8-Bit Platformer</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#111;color:#fff;font-family:monospace}body{display:grid;place-items:center;overflow:hidden}#wrap{width:min(100vw,1200px);padding:12px;text-align:center}canvas{display:block;width:100%;max-height:88vh;image-rendering:pixelated;image-rendering:crisp-edges;background:#5c94fc;border:4px solid #fff;box-shadow:0 0 0 4px #222,0 18px 60px #000;touch-action:none}#help{font-size:13px;line-height:1.5;margin-top:8px;color:#ddd}button{font:inherit;padding:7px 12px;margin:2px;background:#222;color:#fff;border:2px solid #fff;cursor:pointer}button:hover{background:#444}
</style></head><body><div id="wrap"><canvas id="game" width="480" height="270"></canvas><div id="help">A/D or ←/→ move · Space/W/↑ jump (hold for higher jump) · second jump in air · P pause · R restart · Enter start</div></div>
<script>
'use strict';
const C=document.getElementById('game'),X=C.getContext('2d');X.imageSmoothingEnabled=false;
const W=480,H=270,T=16,GRAV=.42,MAXV=3.6;
const keys=new Set(),pressed=new Set();
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','Space'].includes(e.code))e.preventDefault();if(!keys.has(e.code))pressed.add(e.code);keys.add(e.code)});
addEventListener('keyup',e=>keys.delete(e.code));
const down=(...k)=>k.some(x=>keys.has(x)),hit=(...k)=>k.some(x=>pressed.has(x));
let world=1,level=1,score=0,lives=3,coins=0,paused=false,won=false,deadTimer=0;
const powerNames=['MUSHROOM','FIRE FLOWER','STAR','CAPE','ICE FLOWER','BOMB','LIGHTNING','SHIELD','WING','SHELL','GHOST','MAGNET','ROCKET','TELEPORT','REFLECT','HEART','TIME FREEZE','SHADOW','RAINBOW STAR','MEGA'];
const colors=['#f44','#ff8','#fff','#f5c','#8df','#f80','#ff4','#7cf','#8ff','#9c6','#a8f','#fd5','#fa5','#c8f','#ddd','#f77','#7ff','#888','#fef','#f9f'];
let p,blocks,enemies,items,shots,particles,camX,worldWidth,theme;
function clamp(v,a,b){return Math.max(a,Math.min(b,v))} function rects(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function player(small=true){return{x:32,y:180,w:small?13:15,h:15,vx:0,vy:0,on:false,coyote:0,jumps:0,form:'small',power:null,powerTime:0,inv:0,face:1,dead:false}}
function makeLevel(){
 worldWidth=2600+world*900; theme=['grass','night','desert','ice','forest','castle'][(world-1)%6];
 blocks=[];enemies=[];items=[];shots=[];particles=[];
 const groundY=235;
 for(let x=0;x<worldWidth;x+=T) blocks.push({x,y:groundY,w:T,h:H-groundY,t:'ground'});
 const rnd=(n)=>((n*1103515245+12345)>>>0)/4294967296;
 for(let x=180;x<worldWidth-180;x+=72){let r=rnd(x+world*91+level*7);if(r>.22){let y=groundY-(r>.76?64:32);blocks.push({x,y,w:48,h:T,t:'brick'});if(r>.55)items.push({x:x+16,y:y-18,w:12,h:12,type:['coin','mushroom','flower','star','cape','ice','bomb','lightning','shield','wing','shell','ghost','magnet','rocket','teleport','reflect','heart','time','shadow','rainbow','mega'][Math.floor(r*21)]});}}
 for(let x=340;x<worldWidth-160;x+=210){let r=rnd(x+17); if(r>.38) enemies.push({x,y:219,w:14,h:16,vx:r>.65?.65:-.65,type:r>.82?'fly':'goomba',alive:true});}
 // pipes, stairs, gaps represented by raised terrain with decorative columns
 for(let x=520;x<worldWidth-250;x+=520){for(let i=0;i<3;i++)blocks.push({x:x+i*T,y:groundY-(i+1)*T,w:T,h:(i+1)*T,t:'step'});}
 blocks.push({x:worldWidth-96,y:170,w:16,h:65,t:'flag'});
 p=player();camX=0;deadTimer=0;won=false;
}
function solidAt(o){for(const b of blocks)if(b.t!=='flag'&&rects(o,b))return b;return null}
function spawn(x,y,type){items.push({x,y,w:12,h:12,type,vx:type==='rocket'?1:0,vy:0})}
function burst(x,y,n=8){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*3,vy:(Math.random()-.8)*3,life:25})}
function hurt(){if(p.inv>0||p.power==='star'||p.power==='rainbow')return;if(p.form!=='small'){p.form='small';p.power=null;p.powerTime=0;p.inv=90;return}p.dead=true;deadTimer=75;lives--;burst(p.x,p.y,16)}
function collect(it){let t=it.type;if(t==='coin'){coins++;score+=100;burst(it.x,it.y,5);return true} if(t==='heart'){p.inv=100;score+=250;return true} if(t==='mushroom'){p.form='large';p.h=19;p.w=15;p.power=null;score+=500;return true} p.power=t;p.powerTime=(t==='star'||t==='rainbow')?600:900;score+=500;burst(it.x,it.y,10);return true}
function updatePlayer(){
 if(p.dead)return;
 let left=down('ArrowLeft','KeyA'),right=down('ArrowRight','KeyD');
 if(left){p.vx-=.16;p.face=-1} if(right){p.vx+=.16;p.face=1} if(!left&&!right)p.vx*=.82;p.vx=clamp(p.vx,-MAXV,MAXV);
 p.on=false;p.vy+=GRAV;if(p.vy>8)p.vy=8;
 const jump=hit('Space','ArrowUp','KeyW');
 if(jump){if(p.on||p.coyote>0){p.vy=-7.2;p.jumps=1}else if(p.jumps<2){p.vy=-6.4;p.jumps=2}}
 if(!down('Space','ArrowUp','KeyW')&&p.vy<-3)p.vy+=.24;
 p.x+=p.vx; let b=solidAt(p); if(b){if(p.vx>0)p.x=b.x-p.w;else if(p.vx<0)p.x=b.x+b.w;p.vx=0}
 p.y+=p.vy;b=solidAt(p);if(b){if(p.vy>0){p.y=b.y-p.h;p.vy=0;p.on=true;p.jumps=0;p.coyote=4}else{p.y=b.y+b.h;p.vy=.2}}
 p.coyote=p.on?4:Math.max(0,p.coyote-1);p.x=clamp(p.x,0,worldWidth-p.w);
 if(p.y>H+80){hurt();return}
 if(p.inv>0)p.inv--; if(p.powerTime>0)p.powerTime--;else p.power=null;
 if(p.power==='cape'&&down('Space','ArrowUp','KeyW')&&p.vy>0)p.vy*=.82;
 if(p.power==='wing')p.vy=Math.min(p.vy,.28);
 if(p.power==='lightning')p.vx=clamp(p.vx*1.03,-6,6);
 if(p.power==='rocket'&&down('Space','ArrowUp','KeyW'))p.vy=-1.8;
 if(p.power==='teleport'&&hit('KeyE'))p.x=clamp(p.x+p.face*130,0,worldWidth-p.w);
 if((p.power==='fire'||p.power==='flower'||p.power==='ice'||p.power==='bomb'||p.power==='shell'||p.power==='reflect')&&hit('KeyF'))shoot();
 if(p.power==='magnet')for(const it of items){if(Math.hypot(it.x-p.x,it.y-p.y)<75){it.x+=(p.x-it.x)*.08;it.y+=(p.y-it.y)*.08}}
 if(p.power==='time')for(const e of enemies)e.vx*=.98;
 if(p.power==='shadow'&&hit('Space'))p.jumps=1;
 if(p.x>worldWidth-120){score+=5000;level++;if(level>5){level=1;world++;}makeLevel()}
}
function shoot(){let type=p.power==='bomb'?'bomb':p.power==='ice'?'ice':'fire';shots.push({x:p.x+(p.face>0?p.w:0),y:p.y+5,w:7,h:7,vx:p.face*5,vy:type==='bomb'?-2:0,type})}
function updateObjects(){
 for(const e of enemies){if(!e.alive)continue;e.x+=e.vx;if(solidAt(e))e.vx*=-1;if(e.type==='fly')e.y=205+Math.sin((performance.now()/250)+e.x)*28;if(rects(p,e)){if(p.vy>0&&p.y+p.h-e.y<8){e.alive=false;p.vy=-5;score+=200;burst(e.x,e.y)}else hurt()}}
 for(let i=items.length-1;i>=0;i--){let it=items[i];if(it.vx){it.x+=it.vx} if(it.type==='mushroom'||it.type==='shell'||it.type==='rocket')it.y+=it.vy,it.vy+=.12; if(rects(p,it)){collect(it);items.splice(i,1)}}
 for(let i=shots.length-1;i>=0;i--){let s=shots[i];s.x+=s.vx;s.y+=s.vy;s.vy+=s.type==='bomb'?.12:0;for(const e of enemies)if(e.alive&&rects(s,e)){e.alive=false;score+=300;burst(e.x,e.y);shots.splice(i,1);break}if(s.x<0||s.x>worldWidth||s.y>H){shots.splice(i,1)}}
 for(let i=particles.length-1;i>=0;i--){let q=particles[i];q.x+=q.vx;q.y+=q.vy;q.vy+=.1;if(--q.life<=0)particles.splice(i,1)}
}
function drawBackground(){let sky=theme==='night'?'#172052':theme==='desert'?'#f4a261':theme==='ice'?'#9be7ff':theme==='castle'?'#2d274f':'#5c94fc';X.fillStyle=sky;X.fillRect(0,0,W,H);X.fillStyle=theme==='night'?'#fff':'#f8d64e';X.fillRect(380,30,16,16);for(let x=-((camX*.2)%96);x<W;x+=96){X.fillStyle=theme==='desert'?'#e76f51':'#72b84a';X.fillRect(x,205,48,30);X.fillRect(x+16,197,16,38)}}
function px(x,y,w,h,c){X.fillStyle=c;X.fillRect(Math.round(x),Math.round(y),w,h)}
function draw(){drawBackground();
 for(const b of blocks){let x=b.x-camX;if(x<-20||x>W+20)continue;if(b.t==='ground'){px(x,b.y,16,35,theme==='ice'?'#dff':'#8b4513');px(x,b.y,16,3,theme==='ice'?'#fff':'#39a852')}else if(b.t==='brick'){px(x,b.y,b.w,b.h,'#b95a35');for(let j=0;j<b.w;j+=16)px(x+j,b.y,1,16,'#7a3424');}else px(x,b.y,b.w,b.h,'#c98b4b')}
 for(let x=0;x<worldWidth;x+=64){let sx=x-camX;if(sx>-64&&sx<W){px(sx,235,64,4,'#3a9b45')}}
 for(const it of items){let x=it.x-camX;px(x,it.y,it.w,it.h,colors[['coin','mushroom','flower','star','cape','ice','bomb','lightning','shield','wing','shell','ghost','magnet','rocket','teleport','reflect','heart','time','shadow','rainbow','mega'].indexOf(it.type)]||'#fff');if(it.type==='coin')px(x+4,it.y+2,4,8,'#ffe96a')}
 for(const e of enemies)if(e.alive){let x=e.x-camX;px(x,e.y,e.w,e.h,e.type==='fly'?'#a65':'#a33');px(x+3,e.y+4,2,2,'#fff');px(x+9,e.y+4,2,2,'#fff')}
 for(const s of shots)px(s.x-camX,s.y,s.w,s.h,s.type==='ice'?'#8df':s.type==='bomb'?'#222':'#ff7');
 if(!p.dead&&!(p.inv%6===0&&p.inv>0)){let c=p.power==='star'||p.power==='rainbow'?'#fff':p.form==='large'?'#e33':'#e44';px(p.x-camX,p.y,p.w,p.h,c);px(p.x-camX+3,p.y+3,3,3,'#f5c');px(p.x-camX+(p.face>0?9:2),p.y+5,3,3,'#fff')}
 px(worldWidth-96-camX,170,4,65,'#fff');px(worldWidth-92-camX,170,22,12,'#e33');
 for(const q of particles)px(q.x-camX,q.y,3,3,'#fff');
 X.fillStyle='#fff';X.font='10px monospace';X.fillText('WORLD '+world+'-'+level,8,14);X.fillText('SCORE '+score,8,27);X.fillText('COINS '+coins,8,40);X.fillText('LIVES '+lives,8,53);X.fillText(p.power?powerNames[['mushroom','flower','star','cape','ice','bomb','lightning','shield','wing','shell','ghost','magnet','rocket','teleport','reflect','heart','time','shadow','rainbow','mega'].indexOf(p.power)+1]:'POWER: NONE',340,14);
 if(paused||won||p.dead){X.fillStyle='rgba(0,0,0,.65)';X.fillRect(0,0,W,H);X.fillStyle='#fff';X.textAlign='center';X.font='bold 24px monospace';X.fillText(won?'YOU WIN!':p.dead?(lives>0?'READY?':'GAME OVER'):'PAUSED',W/2,110);X.font='12px monospace';X.fillText(won?'ENTER: NEXT WORLD':p.dead?(lives>0?'ENTER: CONTINUE':'ENTER: RESTART'):'P: RESUME',W/2,135);X.textAlign='left'}
}
function frame(){for(let i=0;i<2;i++){if(!paused&&!won){if(p.dead){if(--deadTimer<=0){if(lives<=0){won=false;paused=true}else{makeLevel()}}}else{updatePlayer();updateObjects()}}}camX+=(p.x-W*.38-camX)*.12;camX=clamp(camX,0,Math.max(0,worldWidth-W));draw();pressed.clear();requestAnimationFrame(frame)}
addEventListener('keydown',e=>{if(e.code==='KeyP')paused=!paused;if(e.code==='KeyR'){lives=3;score=0;coins=0;world=1;level=1;makeLevel()}if(e.code==='Enter'&&(p.dead||won)){if(lives<=0){lives=3;score=0;coins=0;world=1;level=1}else if(won){world++;level=1}makeLevel();paused=false}});
makeLevel();requestAnimationFrame(frame);
</script></body></html>
