tom:16%;width:62px;height:62px;font-size:11px}@media(max-width:700px){#help{display:none}main{padding:4px}canvas{border-width:3px}#titleScreen{inset:4px}#mobileControls{display:block}}@media(hover:none) and (pointer:coarse){#mobileControls{display:block}}</style></head><body><main><canvas id="game" width="480" height="270"></canvas><div id="help">A/D or ←/→ move · Space/W/↑ jump · F power · P pause · R restart</div><div id="titleScreen"><div id="titleCard"><h1>RETRO WORLDS</h1><p>8 WORLDS • 3 LEVELS EACH • 8 BOSSES</p><p>Classic pixel platform adventure</p><button id="startButton">START GAME</button></div></div><div id="mobileControls"><div id="joy"><div id="joyKnob"></div></div><button class="mBtn" id="jumpBtn">JUMP</button><button class="mBtn" id="powerBtn">POWER</button></div></main><script>'use strict';

let world=1,level=1,score=0,lives=3,coins=0,paused=false,won=false,dead=0,cam=0,blocks=[],enemies=[],items=[],shots=[],particles=[],p,boss=null,bossMode=false;

const keys=new Set(),pressed=new Set();addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','Space'].includes(e.code))e.preventDefault();if(!keys.has(e.code))pressed.add(e.code);keys.add(e.code)});addEventListener('keyup',e=>keys.delete(e.code));

function makePlayer(){return{x:28,y:180,w:14,h:20,vx:0,vy:0,on:false,jumps:0,face:1,power:null,powerTime:0,inv:0}}
function theme(){return worlds[world-1]}
function resetLevel(){blocks=[];enemies=[];items=[];shots=[];particles=[];boss=null;bossMode=false;p=makePlayer();const width=3000+world*360+level*80,gy=234;checkpointX=Math.floor(width*.5);respawnX=30;checkpointReached=false;for(let x=0;x<width;x+=T)blocks.push({x,y:gy,w:T,h:H-gy,t:'ground'});const seed=world*97+level*31;for(let x=180;x<width-220;x+=72){let r=((x*17+seed*13)%100)/100;if(r>.25){let y=gy-(r>.72?48:32);blocks.push({x,y,w:48,h:T,t:'brick'});if(r>.62&&items.filter(i=>i.type!=='coin').length<2)items.push({x:x+18,y:y-18,w:12,h:12,type:['mushroom','fire','star','ice','shield','rocket'][(((x/72)|0)+world+level)%6]})}}for(let x=300;x<width-300;x+=95){let r=((x*3+seed)%10);if(r<2)blocks.push({x,y:gy-48,w:T,h:T,t:'question',used:false,item:['mushroom','fire','star','ice','shield','rocket'][(r+world+level)%6]})}for(let x=420;x<width-300;x+=210){let r=((x+seed)%7);if(r<4)enemies.push({x,y:gy-16,w:16,h:16,vx:r%2?.55:-.55,vy:0,type:r===3?'fly':'goomba',alive:true})}for(let x=620;x<width-250;x+=520)for(let i=0;i<3;i++)blocks.push({x:x+i*T,y:gy-(i+1)*T,w:T,h:T,t:'step'});blocks.push({x:checkpointX,y:gy-64,w:8,h:64,t:'checkpoint'});blocks.push({x:width-100,y:170,w:16,h:64,t:'goal'});p.x=30;cam=0;dead=0} 
function spawnQuestionItem(b){const type=b.item||'coin';if(type==='coin')items.push({x:b.x+2,y:b.y-16,w:12,h:12,type:'coin',vy:-3});else if(items.filter(i=>i.type!=='coin').length<2)items.push({x:b.x+2,y:b.y-16,w:12,h:12,type,vy:-1.5});score+=50;burst(b.x+8,b.y,8)}
function solidAt(o){for(const b of blocks)if(!['goal','checkpoint','question'].includes(b.t)&&rect(o,b))return b;return null}
function burst(x,y,n=8){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*3,vy:(Math.random()-.8)*3,life:25})}
function hurt(){if(p.inv>0||p.power==='star'||p.power==='rainbow')return;if(p.power&&p.power!=='star'){p.power=null;p.powerTime=0;p.inv=90;return}lives--;dead=70;burst(p.x,p.y,18);if(lives<0){lives=3;score=0;world=1;level=1}}
function startBoss(){bossMode=true;boss={x:360,y:150,w:72,h:72,hp:8,max:8,vx:0,vy:0,t:0,kind:theme().kind,flash:0};p.x=90;p.y=190;blocks=blocks.filter(b=>b.y>=220);for(let x=0;x<480;x+=T)blocks.push({x,y:234,w:T,h:36,t:'arena'})}
function updatePlayer(){if(dead){dead--;if(dead===0){p=makePlayer();p.x=respawnX;cam=Math.max(0,respawnX-120)}return}if(bossMode)return;const L=down('ArrowLeft','KeyA'),R=down('ArrowRight','KeyD');if(L){p.vx-=.28;p.face=-1}if(R){p.vx+=.28;p.face=1}if(!L&&!R)p.vx*=.78;p.vx=clamp(p.vx,-2.5,2.5);p.vy+=.38;p.vy=clamp(p.vy,-10,8);if(hit('Space','ArrowUp','KeyW')&&p.jumps<2){p.vy=p.jumps?-6.4:-7.4;p.jumps++;p.on=false}if(!down('Space','ArrowUp','KeyW')&&p.vy<-3)p.vy+=.18;p.x+=p.vx;let b=solidAt(p);if(b){if(p.vx>0)p.x=b.x-p.w;else if(p.vx<0)p.x=b.x+b.w;p.vx=0}p.y+=p.vy;b=solidAt(p);if(b){if(p.vy>0){p.y=b.y-p.h;p.vy=0;p.on=true;p.jumps=0}else{p.y=b.y+b.h;p.vy=.2;if(b.t==='question'&&!b.used){b.used=true;spawnQuestionItem(b)}}}else p.on=false;if(p.x>=checkpointX)checkpointReached=true;if(p.x>blocks[blocks.length-1].x-80){if(level<3){level++;resetLevel();respawnX=30}else startBoss()}if(p.inv)p.inv--;if(p.powerTime>0)p.powerTime--;else if(p.power)p.power=null;if(hit('KeyF')&&p.power&&['fire','ice','bomb','rocket'].includes(p.power))shoot();if(p.y>H+20)hurt();for(const e of enemies){if(!e.alive)continue;e.x+=e.vx;e.vy+=.35;e.y+=e.vy;const q=solidAt(e);if(q){e.y=q.y-e.h;e.vy=0}if(rect(p,e)){if(p.vy>1&&p.y+p.h<e.y+9){e.alive=false;p.vy=-5;score+=200;burst(e.x,e.y)}else hurt()}}for(let i=items.length-1;i>=0;i--){const it=items[i];if(it.type!=='coin')it.y+=it.vy||0;if(it.type!=='coin'&&!solidAt(it))it.vy=(it.vy||0)+.15;if(rect(p,it)){collect(it);items.splice(i,1)}}if(checkpointReached)respawnX=Math.max(30,checkpointX-10);cam+=(p.x-180-cam)*.12;cam=clamp(cam,0,Math.max(0,blocks[blocks.length-1].x-W))}

function drawBg(){const t=theme();X.fillStyle=t.sky;X.fillRect(0,0,W,H);if(world===2){X.fillStyle='#fff2a6';X.beginPath();X.arc(390,45,28,0,7);X.fill();for(let i=0;i<25;i++){X.fillStyle='#fff';X.fillRect((i*83)%W,(i*47)%150,2,2)}}if(world===3){X.fillStyle='#d98938';for(let x=-40;x<W+80;x+=90){X.beginPath();X.arc(x,230,75,Math.PI,0);X.fill()}}if(world===4){X.fillStyle='#dffaff';for(let x=0;x<W;x+=90)X.fillRect(x,70+(x%120),70,80)}if(world===5){for(let x=0;x<W;x+=80){X.fillStyle='#183d2d';X.fillRect(x,50,24,180);X.fillStyle='#246a3b';X.fillRect(x-18,45,60,35)}}if(world===6){X.fillStyle='#20252d';for(let x=0;x<W;x+=55)X.fillRect(x,60,32,70);X.fillStyle='#50565f';for(let x=0;x<W;x+=80)X.fillRect(x,135,55,8)}if(world===7){X.fillStyle='#42191c';for(let x=0;x<W;x+=70)X.fillRect(x,75+(x%55),50,100);X.fillStyle='#ff6d16';X.fillRect(0,205,W,12)}if(world===8){X.fillStyle='#0e0b12';X.fillRect(20,40,440,195);for(let x=30;x<460;x+=55){X.fillStyle='#403848';X.fillRect(x,70,35,45);X.fillRect(x,145,35,45)}}}

function bossSprite(){if(!boss)return;const x=boss.x,y=boss.y;X.save();X.translate(x,y);if(boss.flash%2)X.globalAlpha=.5;const k=boss.kind;if(k==='brutus'){X.fillStyle='#8a4d2b';X.fillRect(14,16,46,46);X.fillRect(6,30,60,26);X.fillStyle='#b56b3a';X.fillRect(18,5,36,28);X.fillStyle='#111';X.fillRect(26,15,5,5);X.fillRect(43,15,5,5);X.fillStyle='#e7c43d';X.fillRect(25,0,22,7);X.fillStyle='#a82e2e';X.fillRect(5,48,12,20);X.fillRect(55,48,12,20)}else if(k==='phantom'){X.fillStyle='#34205f';X.fillRect(8,16,56,46);X.fillRect(20,5,32,18);X.fillStyle='#ffeb75';X.fillRect(27,13,5,5);X.fillRect(43,13,5,5);X.fillStyle='#d9b94a';X.fillRect(26,0,22,6)}else if(k==='sandfang'){X.fillStyle='#c87424';X.fillRect(15,20,50,45);X.fillRect(5,42,70,24);X.fillStyle='#5b301c';X.fillRect(9,27,25,18);X.fillStyle='#eee';X.fillRect(12,30,4,4);X.fillRect(25,30,4,4);for(let i=0;i<4;i++){X.fillStyle='#e39b35';X.fillRect(20+i*11,56,7,7)}}else if(k==='frost'){X.fillStyle='#55bde8';X.fillRect(14,15,48,48);X.fillRect(3,28,18,30);X.fillRect(55,28,18,30);X.fillStyle='#bff7ff';X.fillRect(21,4,10,18);X.fillRect(43,4,10,18);X.fillStyle='#142c4a';X.fillRect(25,27,5,5);X.fillRect(43,27,5,5)}else if(k==='thorn'){X.fillStyle='#55381f';X.fillRect(18,12,36,55);X.fillStyle='#28713b';X.fillRect(2,18,22,12);X.fillRect(50,18,22,12);X.fillRect(5,42,16,12);X.fillRect(51,42,16,12);X.fillStyle='#ff5b35';X.fillRect(27,27,6,6);X.fillRect(43,27,6,6)}else if(k==='mecha'){X.fillStyle='#303842';X.fillRect(15,12,45,52);X.fillRect(2,27,18,27);X.fillRect(57,27,18,27);X.fillStyle='#e23c36';X.fillRect(31,25,12,12);X.fillStyle='#111';X.fillRect(34,28,6,6);X.fillStyle='#ff9d2e';X.fillRect(19,59,10,8);X.fillRect(51,59,10,8)}else if(k==='magma'){X.fillStyle='#4a2624';X.fillRect(15,20,45,45);X.fillRect(6,36,18,25);X.fillRect(52,36,18,25);X.fillStyle='#ef5d1b';X.fillRect(25,8,10,15);X.fillRect(43,5,9,17);X.fillStyle='#ffb32b';X.fillRect(25,30,8,8);X.fillRect(42,30,8,8);X.fillStyle='#d33b24';X.fillRect(60,8,13,5);X.fillRect(58,15,15,5)}else{X.fillStyle='#29233c';X.fillRect(13,12,50,55);X.fillRect(2,30,18,28);X.fillRect(58,30,18,28);X.fillStyle='#a837cf';X.fillRect(26,26,7,7);X.fillRect(44,26,7,7);X.fillStyle='#cf3f63';X.fillRect(23,0,28,8);X.fillStyle='#7f45ff';X.fillRect(64,48,20,5)}X.restore();X.globalAlpha=1}
function drawItems(){for(const it of items){const x=it.x-cam;if(x<-20||x>W+20)continue;let col=it.type==='coin'?'#ffd43b':it.type==='mushroom'?'#ef3d35':it.type==='fire'?'#ff7b24':it.type==='ice'?'#73ddff':it.type==='star'?'#ffe93b':'#7a8cff';X.fillStyle=col;X.fillRect(x+2,it.y+2,8,8);X.fillStyle='#fff';X.fillRect(x+4,it.y+3,2,2)}for(const s of shots){X.fillStyle=s.type==='boss'?'#ff3b55':'#fff';X.fillRect(s.x-cam,s.y,s.w,s.h)}}
function draw(){drawBg();for(const b of blocks)tile(b);drawItems();for(const e of enemies)if(e.alive){X.fillStyle=e.type==='fly'?'#8b55d9':'#9b552d';X.fillRect(e.x-cam,e.y,e.w,e.h);X.fillStyle='#fff';X.fillRect(e.x-cam+3,e.y+3,3,3);X.fillRect(e.x-cam+10,e.y+3,3,3)}if(bossMode){bossSprite();X.fillStyle='#111';X.fillRect(145,10,190,10);X.fillStyle='#e33';X.fillRect(147,12,186*(boss.hp/boss.max),6);X.fillStyle='#fff';X.font='10px monospace';X.textAlign='center';X.fillText(theme().boss,240,8)}drawPlayer();for(const q of particles){X.fillStyle=theme().accent;X.fillRect(q.x-cam,q.y,3,3)}X.fillStyle='#fff';X.font='10px monospace';X.textAlign='left';X.fillText(`WORLD ${world}-1  SCORE ${score}  COINS ${coins}  LIVES ${lives}`,8,14);if(paused||won||dead){X.fillStyle='rgba(0,0,0,.65)';X.fillRect(0,0,W,H);X.fillStyle='#fff';X.font='bold 24px monospace';X.textAlign='center';X.fillText(won?'YOU WIN!':paused?'PAUSED':lives>0?'HIT!':'GAME OVER',W/2,110);X.font='12px monospace';X.fillText(won?'8 WORLDS CLEARED':paused?'PRESS P TO RESUME':'KEEP GOING',W/2,138)}}
function frame(){if(gameStarted&&!paused&&!won){if(bossMode)updateBoss();else updatePlayer();for(let i=particles.length-1;i>=0;i--){const q=particles[i];q.x+=q.vx;q.y+=q.vy;q.vy+=.08;if(--q.life<=0)particles.splice(i,1)}}draw();pressed.clear();mobile.jumpQueued=false;mobile.actionQueued=false;requestAnimationFrame(frame)}
function startGame(){gameStarted=true;document.getElementById('titleScreen').style.display='none';resetLevel()}
document.getElementById('startButton').addEventListener('click',startGame);
addEventListener('keydown',e=>{if(e.code==='Space'&& !gameStarted){e.preventDefault();startGame();return}if(e.code==='Enter'&& !gameStarted){startGame();return}if(e.code==='KeyP')paused=!paused;if(e.code==='KeyR'){world=1;level=1;score=0;coins=0;lives=3;won=false;gameStarted=true;document.getElementById('titleScreen').style.display='none';resetLevel()}if(e.code==='Enter'&&won){won=false;world=1;level=1;score=0;coins=0;lives=3;gameStarted=true;document.getElementById('titleScreen').style.display='none';resetLevel()}});
const joy=document.getElementById('joy'),knob=document.getElementById('joyKnob');let joyId=null;function setJoy(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,max=38,mag=Math.hypot(dx,dy)||1,n=Math.min(1,max/mag),x=dx*n;knob.style.transform=`translate(${x}px,${dy*n}px)`;mobile.left=x<-12;mobile.right=x>12}function endJoy(){joyId=null;mobile.left=false;mobile.right=false;knob.style.transform='translate(0,0)'}joy.addEventListener('pointerdown',e=>{joyId=e.pointerId;joy.setPointerCapture(e.pointerId);setJoy(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)setJoy(e)});joy.addEventListener('pointerup',endJoy);joy.addEventListener('pointercancel',endJoy);
function bindTap(id,prop,queue){const el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();mobile[prop]=true;if(queue)mobile[queue]=true});el.addEventListener('pointerup',e=>{e.preventDefault();mobile[prop]=false});el.addEventListener('pointercancel',()=>mobile[prop]=false)}bindTap('jumpBtn','jump','jumpQueued');bindTap('powerBtn','action','actionQueued');
if(!isMobile)document.getElementById('mobileControls').style.display='none';
resetLevel();requestAnimationFrame(frame);
