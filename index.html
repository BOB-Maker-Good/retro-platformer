<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Retro Worlds</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <section id="deviceScreen" class="screen">
    <div class="logo">RETRO<br><span>WORLDS</span></div>
    <p class="tag">YOUR ART. YOUR WORLDS. YOUR ADVENTURE.</p>
    <h2>CHOOSE YOUR DEVICE</h2>
    <div class="deviceGrid">
      <button class="device" id="computerChoice"><b>🖥️ COMPUTER</b><small>A / D or arrows<br>SPACE to jump · F to use item</small></button>
      <button class="device" id="phoneChoice"><b>📱 PHONE</b><small>Joystick + JUMP + USE ITEM<br>built for touch</small></button>
    </div>
    <p class="tiny">8 WORLDS · 8 LEVELS EACH · 8 BOSS FIGHTS</p>
  </section>

  <section id="gameScreen" class="screen hidden">
    <header class="hud"><span id="worldLabel">WORLD 1-1</span><span id="scoreLabel">SCORE 000000</span><span id="livesLabel">♥ 3</span></header>
    <div id="canvasWrap"><canvas id="game" width="480" height="270"></canvas><div id="message"></div></div>
    <div id="desktopHelp">A/D or ←/→ MOVE · SPACE/W/↑ JUMP · F USE ITEM · P PAUSE · R RESTART</div>
    <div id="touchControls" class="hidden">
      <div id="joystick"><div id="joyKnob"></div></div>
      <button id="jumpBtn" class="touchBtn">JUMP</button>
      <button id="useBtn" class="touchBtn use">USE<br>ITEM</button>
    </div>
  </section>
</main>
<script>
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
const W=480,H=270,T=16;
const worlds=[
 ['GRASSLANDS','#62c9ff','#2f9e43','#754221','#ffd447','king-brutus'],
 ['NIGHT HAUNTED','#141936','#4d376d','#302844','#bba8ff','phantom-king'],
 ['DESERT','#e98e3c','#d29a4b','#8f552d','#fff06a','sandfang'],
 ['ICE','#91ddff','#d7f7ff','#4d86b7','#ffffff','frostbite'],
 ['FOREST','#1f5138','#39884a','#49301d','#e6d95e','thornback'],
 ['FACTORY','#303640','#69727b','#3e444c','#ffc928','mecha-9'],
 ['VOLCANO','#241217','#9a3325','#2a2222','#ff8d1c','magmagon'],
 ['FINAL CASTLE','#17121d','#57515f','#28232f','#d83f68','dark-overlord']
];
const bossNames=['King Brutus','Phantom King','Sandfang','Frostbite','Thornback','MECHA-9','Magmagon','The Dark Overlord'];
const art=new Image();art.src='assets/retro-art.webp';
const cell=(n)=>[(n%4)*160,Math.floor(n/4)*160,160,160];
let mode=null,world=1,level=1,score=0,lives=3,paused=false,won=false,deadTimer=0,cam=0,checkpoint=0,respawn=30;
let player,enemies=[],items=[],blocks=[],boss=null,shots=[],particles=[],usedPowerups=0,levelWidth=0;
const input={left:false,right:false,jump:false,jumpQueued:false,use:false,useQueued:false};
const keys=new Set(),pressed=new Set();
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','Space'].includes(e.code))e.preventDefault();if(!keys.has(e.code))pressed.add(e.code);keys.add(e.code);});
addEventListener('keyup',e=>keys.delete(e.code));
const down=(...codes)=>codes.some(c=>keys.has(c))||((codes.includes('ArrowLeft')||codes.includes('KeyA'))&&input.left)||((codes.includes('ArrowRight')||codes.includes('KeyD'))&&input.right)||((codes.includes('Space')||codes.includes('ArrowUp')||codes.includes('KeyW'))&&input.jump);
const hit=(...codes)=>codes.some(c=>pressed.has(c))||((codes.includes('Space')||codes.includes('ArrowUp')||codes.includes('KeyW'))&&input.jumpQueued)||((codes.includes('KeyF'))&&input.useQueued);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rect=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function theme(){return worlds[world-1]}
function resetPlayer(){player={x:respawn,y:180,w:16,h:24,vx:0,vy:0,on:false,jumps:0,face:1,power:null,powerTime:0,inv:0};}
function buildLevel(){
 blocks=[];enemies=[];items=[];shots=[];particles=[];boss=null;usedPowerups=0;cam=0;deadTimer=0;
 levelWidth=2600+world*160+level*70;
 checkpoint=Math.floor(levelWidth*.5);respawn=30;resetPlayer();
 const groundY=238;
 for(let x=0;x<levelWidth;x+=T) blocks.push({x,y:groundY,w:T,h:H-groundY,t:'ground'});
 const seed=world*991+level*37;
 for(let x=180;x<levelWidth-220;x+=80){const r=((x*13+seed)%100)/100;if(r>.2){const y=groundY-(r>.7?64:40);blocks.push({x,y,w:48,h:T,t:'platform'});if(r>.73&&usedPowerups<2){items.push({x:x+16,y:y-34,w:26,h:26,type:['mushroom','fire','star','ice','shield','rocket'][(x/80+world+level)%6|0]});usedPowerups++;}}}
 for(let x=300;x<levelWidth-250;x+=140){if(((x+seed)%5)<2)blocks.push({x,y:groundY-48,w:T,h:T,t:'question',used:false,item:usedPowerups<2?['mushroom','fire','star','ice','shield','rocket'][(x/140+world)%6|0]:'coin'});}
 for(let x=420;x<levelWidth-260;x+=230){const r=(x+seed)%7;if(r<5)enemies.push({x,y:groundY-40,w:30,h:30,vx:r%2?.65:-.65,vy:0,alive:true});}
 blocks.push({x:checkpoint,y:groundY-80,w:8,h:80,t:'checkpoint'});
 blocks.push({x:levelWidth-110,y:groundY-96,w:8,h:96,t:'goal'});
}
function startBoss(){
 blocks=[];enemies=[];items=[];shots=[];particles=[];boss={x:320,y:115,w:120,h:120,hp:12,max:12,t:0,flash:0};player.x=70;player.y=190;player.vx=0;player.vy=0;cam=0;
 for(let x=0;x<W;x+=T)blocks.push({x,y:238,w:T,h:32,t:'ground'});
}
function solidAt(o){for(const b of blocks)if(['ground','platform','question','bossfloor'].includes(b.t)&&rect(o,b))return b;return null;}
function burst(x,y,n=10){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*3.5,vy:(Math.random()-1)*3.5,life:30});}
function questionHit(b){if(b.used)return;b.used=true;if(b.item==='coin'){score+=100;burst(b.x+8,b.y,8);return;}if(usedPowerups<2){items.push({x:b.x-2,y:b.y-28,w:26,h:26,type:b.item,vy:-1});usedPowerups++;score+=50;burst(b.x+8,b.y,8);}}
function collect(it){score+=it.type==='coin'?100:500;if(it.type!=='coin'){player.power=it.type;player.powerTime=900;burst(it.x,it.y,12);} }
function hurt(){if(player.inv>0||player.power==='star')return;if(player.power){player.power=null;player.powerTime=0;player.inv=100;return;}lives--;deadTimer=70;burst(player.x,player.y,20);if(lives<=0){lives=3;world=1;level=1;score=0;won=false;}}
function shoot(){const type=player.power||'normal';shots.push({x:player.x+(player.face>0?player.w:0),y:player.y+8,w:10,h:7,vx:player.face*6,vy:0,type});}
function updateNormal(){
 if(deadTimer){deadTimer--;if(deadTimer===0){resetPlayer();}return;}
 const L=down('ArrowLeft','KeyA'),R=down('ArrowRight','KeyD');if(L){player.vx-=.25;player.face=-1;}if(R){player.vx+=.25;player.face=1;}if(!L&&!R)player.vx*=.8;player.vx=clamp(player.vx,-2.5,2.5);
 player.vy=clamp(player.vy+.4,-10,8);
 if(hit('Space','ArrowUp','KeyW')&&player.jumps<2){player.vy=player.jumps?-6.4:-7.6;player.jumps++;player.on=false;}
 if(!down('Space','ArrowUp','KeyW')&&player.vy<-3)player.vy+=.18;
 player.x+=player.vx;let b=solidAt(player);if(b){if(player.vx>0)player.x=b.x-player.w;else if(player.vx<0)player.x=b.x+b.w;player.vx=0;}
 player.y+=player.vy;b=solidAt(player);if(b){if(player.vy>0){player.y=b.y-player.h;player.vy=0;player.on=true;player.jumps=0;}else{player.y=b.y+b.h;player.vy=.2;if(b.t==='question')questionHit(b);}}else player.on=false;
 if(player.x>=checkpoint)respawn=Math.max(30,checkpoint-12);
 if(player.x>levelWidth-150){if(level<8){level++;buildLevel();}else startBoss();}
 if(player.inv)player.inv--;if(player.powerTime>0)player.powerTime--;else player.power=null;
 if(hit('KeyF')&&player.power&&['fire','ice','rocket'].includes(player.power))shoot();
 if(player.y>H+30)hurt();
 for(const e of enemies){if(!e.alive)continue;e.x+=e.vx;e.vy+=.35;e.y+=e.vy;const q=solidAt(e);if(q){e.y=q.y-e.h;e.vy=0;}if(rect(player,e)){if(player.vy>1&&player.y+player.h<e.y+12){e.alive=false;player.vy=-5.5;score+=200;burst(e.x,e.y);}else hurt();}}
 for(let i=items.length-1;i>=0;i--){const it=items[i];it.y+=it.vy||0;if(it.type!=='coin'&&!solidAt(it))it.vy=(it.vy||0)+.15;if(rect(player,it)){collect(it);items.splice(i,1);}}
 cam+=(player.x-170-cam)*.12;cam=clamp(cam,0,Math.max(0,levelWidth-W));
}
function updateBoss(){
 if(!boss)return;boss.t++;if(boss.flash)boss.flash--;
 const L=down('ArrowLeft','KeyA'),R=down('ArrowRight','KeyD');if(L)player.vx-=.18;if(R)player.vx+=.18;if(!L&&!R)player.vx*=.8;player.vx=clamp(player.vx,-2.5,2.5);player.x=clamp(player.x+player.vx,8,450);
 player.vy=clamp(player.vy+.38,-10,8);if(hit('Space','ArrowUp','KeyW')&&player.jumps<2){player.vy=player.jumps?-6.5:-7.5;player.jumps++;}player.y+=player.vy;if(player.y+player.h>238){player.y=238-player.h;player.vy=0;player.jumps=0;player.on=true;}
 if(hit('KeyF')&&player.power)shoot();
 if(['king-brutus','frostbite','mecha-9','dark-overlord'].includes(theme()[5])){boss.x=300+Math.sin(boss.t*.025)*90;boss.y=115+Math.abs(Math.sin(boss.t*.035))*65;}
 if(theme()[5]==='phantom-king'||theme()[5]==='magmagon'){boss.x=280+Math.sin(boss.t*.025)*120;boss.y=80+Math.sin(boss.t*.04)*55;}
 if(theme()[5]==='sandfang'){boss.x=260+Math.sin(boss.t*.02)*130;boss.y=135+Math.abs(Math.sin(boss.t*.05))*55;}
 if(theme()[5]==='thornback'){boss.x=300;boss.y=110+Math.sin(boss.t*.03)*25;}
 if(boss.t%75===0){const dx=player.x-boss.x,dy=player.y-boss.y,d=Math.hypot(dx,dy)||1;shots.push({x:boss.x+boss.w/2,y:boss.y+45,w:9,h:9,vx:dx/d*2.7,vy:dy/d*2.7,type:'boss'});}
 for(let i=shots.length-1;i>=0;i--){const s=shots[i];s.x+=s.vx;s.y+=s.vy;if(s.type==='boss'){if(rect(s,player)){hurt();shots.splice(i,1);}else if(s.x<-20||s.x>500||s.y<-20||s.y>290)shots.splice(i,1);}else if(rect(s,boss)){boss.hp--;boss.flash=8;score+=350;burst(boss.x+boss.w/2,boss.y+boss.h/2,12);shots.splice(i,1);if(boss.hp<=0){score+=5000;boss=null;if(world===8)won=true;else{world++;level=1;buildLevel();}}}}
 if(boss&&rect(player,boss)){if(player.vy>1&&player.y+player.h<boss.y+35){boss.hp--;player.vy=-7;boss.flash=8;score+=500;burst(boss.x+50,boss.y+40);}else hurt();}
}
function drawBackground(){const [name,sky,top,ground,accent]=theme();ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);if(world===2){ctx.fillStyle='#fff4ad';ctx.beginPath();ctx.arc(390,48,25,0,7);ctx.fill();}if(world===3){ctx.fillStyle='#d37a35';for(let x=-80;x<W+100;x+=110){ctx.beginPath();ctx.arc(x,250,80,Math.PI,0);ctx.fill();}}if(world===4){ctx.fillStyle='#e6fbff';for(let x=0;x<W;x+=80)ctx.fillRect(x,65+(x%50),50,90);}if(world===5){ctx.fillStyle='#143b29';for(let x=0;x<W;x+=80){ctx.fillRect(x+25,45,20,175);ctx.fillRect(x,45,70,35);}}if(world===6){ctx.fillStyle='#222832';for(let x=0;x<W;x+=60)ctx.fillRect(x,55,38,115);ctx.fillStyle='#656d75';for(let x=0;x<W;x+=80)ctx.fillRect(x,150,55,6);}if(world===7){ctx.fillStyle='#45181c';for(let x=0;x<W;x+=75)ctx.fillRect(x,65+(x%45),50,120);ctx.fillStyle='#f25b16';ctx.fillRect(0,205,W,10);}if(world===8){ctx.fillStyle='#0e0b12';ctx.fillRect(20,40,440,195);}}
function drawBlock(b){const x=Math.round(b.x-cam);if(x<-30||x>W+30)return;const [,,top,ground,accent]=theme();if(b.t==='ground'){ctx.fillStyle=ground;ctx.fillRect(x,b.y,b.w,b.h);ctx.fillStyle=top;ctx.fillRect(x,b.y,b.w,5);}else if(b.t==='platform'){ctx.fillStyle=ground;ctx.fillRect(x,b.y,b.w,b.h);ctx.fillStyle=top;ctx.fillRect(x,b.y,b.w,4);ctx.fillStyle='#222';for(let i=8;i<b.w;i+=16)ctx.fillRect(x+i,b.y+7,2,b.h-7);}else if(b.t==='question'){ctx.fillStyle=b.used?'#765d24':'#f3bb2e';ctx.fillRect(x,b.y,b.w,b.h);ctx.strokeStyle='#4b320b';ctx.lineWidth=2;ctx.strokeRect(x+1,b.y+1,b.w-2,b.h-2);ctx.fillStyle='#4b320b';ctx.font='bold 14px monospace';ctx.fillText(b.used?'·':'?',x+3,b.y+13);}else if(b.t==='checkpoint'){ctx.fillStyle='#6b4122';ctx.fillRect(x,b.y,4,b.h);ctx.fillStyle='#42dc73';ctx.fillRect(x+4,b.y+5,20,14);}else if(b.t==='goal'){ctx.fillStyle='#eee';ctx.fillRect(x,b.y,4,b.h);ctx.fillStyle=accent;ctx.fillRect(x+4,b.y,25,16);}}
function drawPlayer(){if(player.inv&&Math.floor(player.inv/5)%2)return;const name=player.power==='fire'?'player-fire':player.power==='ice'?'player-ice':player.power==='feather'?'player-feather':player.power==='wings'?'player-wings':player.power?'player-large':'player-small';const im=asset(name);const x=Math.round(player.x-cam),y=Math.round(player.y);if(im.complete)ctx.drawImage(im,x-5,y-10,42,48);}
function drawItems(){const map={mushroom:'power-mushroom',fire:'power-fire',star:'power-star',ice:'power-ice',shield:'power-shield',rocket:'power-rocket'};for(const it of items){const x=it.x-cam;if(x<-40||x>W+40)continue;const im=asset(map[it.type]||'power-mushroom');if(im.complete)ctx.drawImage(im,x-4,it.y-4,38,48);}}
function drawEnemies(){const im=asset('enemy-goomba');for(const e of enemies)if(e.alive&&im.complete)ctx.drawImage(im,e.x-cam-5,e.y-8,42,42);}
function drawBoss(){if(!boss)return;const im=asset(theme()[5]);if(!im.complete)return;ctx.save();if(boss.flash%2)ctx.globalAlpha=.45;ctx.drawImage(im,boss.x,boss.y,boss.w,boss.h);ctx.restore();ctx.fillStyle='#111';ctx.fillRect(115,9,250,11);ctx.fillStyle='#e43c4b';ctx.fillRect(117,11,246*(boss.hp/boss.max),7);ctx.fillStyle='#fff';ctx.font='bold 11px monospace';ctx.textAlign='center';ctx.fillText(bossNames[world-1],240,8);ctx.textAlign='left';}
function draw(){drawBackground();for(const b of blocks)drawBlock(b);drawItems();drawEnemies();drawBoss();for(const s of shots){ctx.fillStyle=s.type==='boss'?'#ff3957':'#fff';ctx.fillRect(s.x-cam,s.y,s.w,s.h);}drawPlayer();for(const q of particles){ctx.fillStyle=theme()[4];ctx.fillRect(q.x-cam,q.y,3,3);}ctx.fillStyle='#fff';ctx.font='bold 10px monospace';ctx.fillText(`WORLD ${world}-${level}`,8,14);ctx.fillText(`SCORE ${String(score).padStart(6,'0')}`,110,14);ctx.fillText(`LIVES ${lives}`,235,14);if(paused||won||deadTimer){ctx.fillStyle='rgba(0,0,0,.62)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 24px monospace';ctx.fillText(won?'ALL 8 WORLDS CLEARED!':paused?'PAUSED':'OUCH!',240,110);ctx.font='11px monospace';ctx.fillText(won?'YOU BEAT ALL 8 BOSSES':paused?'PRESS P TO RESUME':'RESPAWNING...',240,132);ctx.textAlign='left';}}
function tick(){if(mode==='computer'||mode==='phone'){if(!paused&&!won){if(boss)updateBoss();else updateNormal();for(let i=particles.length-1;i>=0;i--){const q=particles[i];q.x+=q.vx;q.y+=q.vy;q.vy+=.08;if(--q.life<=0)particles.splice(i,1);}}draw();updateHud();}pressed.clear();input.jumpQueued=false;input.useQueued=false;requestAnimationFrame(tick);}
function updateHud(){document.getElementById('worldLabel').textContent=`WORLD ${world}-${level}`;document.getElementById('scoreLabel').textContent=`SCORE ${String(score).padStart(6,'0')}`;document.getElementById('livesLabel').textContent=`♥ ${lives}`;}
function choose(m){mode=m;document.getElementById('deviceScreen').classList.add('hidden');document.getElementById('gameScreen').classList.remove('hidden');if(m==='phone'){document.getElementById('touchControls').classList.remove('hidden');document.getElementById('desktopHelp').classList.add('hidden');}else{document.getElementById('touchControls').classList.add('hidden');}buildLevel();}
document.getElementById('computerChoice').onclick=()=>choose('computer');document.getElementById('phoneChoice').onclick=()=>choose('phone');
addEventListener('keydown',e=>{if(e.code==='KeyP')paused=!paused;if(e.code==='KeyR'){world=1;level=1;score=0;lives=3;won=false;buildLevel();}if(e.code==='Enter'&&won){world=1;level=1;score=0;lives=3;won=false;buildLevel();}});
const joy=document.getElementById('joystick'),knob=document.getElementById('joyKnob');let joyId=null;function moveJoy(e){const r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),max=38,m=Math.hypot(dx,dy)||1,n=Math.min(1,max/m);knob.style.transform=`translate(${dx*n}px,${dy*n}px)`;input.left=dx<-12;input.right=dx>12;}function endJoy(){joyId=null;input.left=false;input.right=false;knob.style.transform='translate(0,0)';}joy.onpointerdown=e=>{joyId=e.pointerId;joy.setPointerCapture(e.pointerId);moveJoy(e)};joy.onpointermove=e=>{if(e.pointerId===joyId)moveJoy(e)};joy.onpointerup=endJoy;joy.onpointercancel=endJoy;
function bindTouch(id,prop,queue){const el=document.getElementById(id);el.onpointerdown=e=>{e.preventDefault();input[prop]=true;if(queue)input[queue]=true;};el.onpointerup=e=>{e.preventDefault();input[prop]=false;};el.onpointercancel=()=>input[prop]=false;}
bindTouch('jumpBtn','jump','jumpQueued');bindTouch('useBtn','use','useQueued');
tick();
</script>
</body></html>
